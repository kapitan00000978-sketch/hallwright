name: Rust Core Gatekeeper Engine

on:
  push:
    branches: [ main, develop ]
    paths:
      - 'crates/**'
      - '.github/workflows/rust-engine.yml'
  pull_request:
    branches: [ main, develop ]
    paths:
      - 'crates/**'

jobs:
  build-and-test-rust:
    name: Build & Test Rust Core (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Rust Toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Build Rust Gatekeeper Release
        run: |
          cargo build --release --manifest-path crates/hallwright-core/Cargo.toml

      - name: Upload Binary Artifact
        uses: actions/upload-artifact@v4
        with:
          name: hallwright-rust-${{ matrix.os }}
          path: crates/hallwright-core/target/release/hallwright*
