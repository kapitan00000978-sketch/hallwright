[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "hallwright"
version = "0.11.0"
description = "Hallwright: Autonomous Quality Protocol, Pre-Commit Craftsmanship Gate, Living Memory, and Awwwards-Grade 3D Spatial Physics Synthesis"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Hallwright Open Source Project" }]
keywords = ["ai", "agents", "craftsmanship", "guardrails", "mcp", "cursor", "claude", "quality-gate", "pre-commit"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]

[project.scripts]
hallwright = "hallwright_cli:main"

[tool.setuptools]
py-modules = ["hallwright_cli"]

[tool.setuptools.packages.find]
where = ["."]
include = ["src*", "professions*", "scripts*", "mcp*"]

[tool.setuptools.package-data]
"*" = ["*.md", "*.json", "*.sh", "*.bat", "*.yaml", "*.yml"]


[project.optional-dependencies]
dev = [
    "pytest>=7.4.0,<9.0.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
pythonpath = [".", "src", "src/sdk", "mcp", "scripts", "packs/science"]
addopts = "-v --tb=short"

[tool.pyright]
extraPaths = [".", "src", "src/sdk", "mcp", "scripts", "packs/science"]
include = ["src", "mcp", "tests", "scripts", "cli"]

